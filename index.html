<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Focus Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎯 Focus Timer</h1>  

    <div class="input-group">
      <div>
        <label for="workInput">Work (mins)</label>
        <input type="number" id="workInput" value="25" min="1">
      </div>
      <div>
        <label for="breakInput">Break (mins)</label>
        <input type="number" id="breakInput" value="5" min="1">
      </div>
    </div>

    <div class="timer-wrapper">
      <svg class="progress-ring" width="220" height="220">
        <circle class="progress-ring__circle" stroke="#6366f1" stroke-width="10" fill="transparent" r="100" cx="110" cy="110"/>
      </svg>
      <div id="timer">25:00</div>
    </div>

    <div class="buttons">
      <button id="start">▶ Start</button>
      <button id="stop">⏸ Stop</button>
      <button id="reset">🔄 Reset</button>
    </div>

    <div id="status">Session</div>

    <div id="alarmOverlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlayMessage">Time’s up!</p>
        <button id="stopAlarmBtn">✅ Stop Alarm</button>
      </div>
    </div>
  </div>

  <audio id="alarm" src="alarm.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
